# Significato di `status` (verificato 2026-10-14, story 1.3): nel tracker dice se la story e' avviabile
# (`backlog` = dipendenze ancora aperte, `blocked` = serve una decisione o un'approvazione); nel file della story
# dice lo stato del documento (`ready-for-dev` = compilata e validabile). I due valori possono differire senza
# errore: non si allineano a occhio. Uno scarto e' un difetto solo quando le dipendenze sono tutte `done`.
